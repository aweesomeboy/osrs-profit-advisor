<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Profit Advisor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>OSRS Profit Advisor</h1>
            </div>
            <div class="header-center">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search items by name or ID..."
                >
            </div>
            <div class="header-right">
                <button id="refreshBtn" class="btn btn-primary">⟲ Refresh</button>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Dashboard Info -->
        <div class="dashboard-info">
            <div class="info-card">
                <span class="info-label">API Status:</span>
                <span class="info-value" id="apiStatus">Loading...</span>
            </div>
            <div class="info-card">
                <span class="info-label">Last Sync:</span>
                <span class="info-value" id="lastSync">Never</span>
            </div>
            <div class="info-card">
                <span class="info-label">Next Sync:</span>
                <span class="info-value" id="nextSync">-</span>
            </div>
            <div class="info-card">
                <span class="info-label">Items Loaded:</span>
                <span class="info-value" id="itemCount">0</span>
            </div>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-error" style="display: none;">
            <span id="errorMessage"></span>
            <button id="retryBtn" class="btn btn-small">Retry</button>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Loading items...</p>
        </div>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <!-- Table Controls -->
            <div class="table-controls">
                <div class="sort-controls">
                    <label>Sort by:</label>
                    <select id="sortBy">
                        <option value="name">Name</option>
                        <option value="high_price">Buy Price</option>
                        <option value="low_price">Sell Price</option>
                        <option value="margin">Margin</option>
                        <option value="roi">ROI</option>
                    </select>
                    <select id="sortOrder">
                        <option value="asc">↑ Ascending</option>
                        <option value="desc">↓ Descending</option>
                    </select>
                </div>
                <div class="page-size-control">
                    <label>Per page:</label>
                    <select id="pageSize">
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <!-- Items Table -->
            <div class="table-wrapper">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Item ID</th>
                            <th>Buy Price</th>
                            <th>Sell Price</th>
                            <th>Margin</th>
                            <th>ROI %</th>
                            <th>Buy Limit</th>
                            <th>Last Update</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody">
                        <tr>
                            <td colspan="8" class="loading-cell">Loading items...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <!-- Generated by JavaScript -->
            </div>

            <!-- No Results -->
            <div id="noResults" class="no-results" style="display: none;">
                <p>No items found matching your search.</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
